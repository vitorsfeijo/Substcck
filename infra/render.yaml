services:
  - type: web
    name: substcck-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://vitorsfeijo.github.io
      - key: DATABASE_URL
        sync: false
